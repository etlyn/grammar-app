name: pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn

      - name: Install
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Verify learning and content
        run: |
          yarn test
          yarn content:check

      - name: Build
        run: |
          yarn build
          touch ./dist/.nojekyll

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run real browser acceptance
        env:
          GRAMMACHO_BUILD_SHA: ${{ github.sha }}
          GRAMMACHO_RESULTS_PATH: browser-outcomes.json
        run: |
          yarn preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/grammacho-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173 > /dev/null && break
            sleep 1
          done
          yarn test:browser

      - name: Preserve executed outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: browser-outcomes.json
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
