<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"
    role="img" aria-labelledby="title desc">
    <title id="title">Grammacho logo</title>
    <desc id="desc">A white chat mascot wearing a sombrero on a purple rounded square.</desc>
    <defs>
        <linearGradient id="bg" x1="160" y1="96" x2="860" y2="908" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#693cf4" />
            <stop offset="0.5" stop-color="#512bdc" />
            <stop offset="1" stop-color="#4024ce" />
        </linearGradient>
        <linearGradient id="ghost" x1="374" y1="379" x2="642" y2="822"
            gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" />
